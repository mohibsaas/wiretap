[project]
name = "wiretap"
version = "0.1.0"
description = "CLI-first voice agent test simulator — call live agents, score with LLM-as-judge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "wiretap contributors" }]
keywords = ["voice", "agents", "testing", "eval", "webrtc", "ci"]
dependencies = [
  "litellm>=1.50.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12.0",
  "pyai-sdk>=0.2.0",
  "livekit>=0.17.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
# PSTN dialing over Twilio. audioop was removed from the stdlib in 3.13 and
# pyVoIP still imports it.
pstn = [
  "twilio>=9.0",
  "pyVoIP>=1.6.8",
  "audioop-lts>=0.2; python_version >= '3.13'",
]
dev = ["pytest>=8.0", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
wiretap = "wiretap.cli.main:app"
wiretap-mcp = "wiretap.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiretap"]

[tool.hatch.build.targets.wheel.sources]
"src/wiretap" = "wiretap"

[tool.hatch.build.targets.wheel.force-include]
"src/wiretap/ui/static" = "wiretap/ui/static"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
